<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة تسعير المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161412; --bg2:#1d1a17; --card:#211e1a; --card-hi:#2a2521;
    --ink:#f2ece1; --sub:#a89d8c; --line:#3a332b;
    --gold:#c9a15a; --gold-soft:rgba(201,161,90,.18); --gold-line:rgba(201,161,90,.35);
    --green:#7fa383; --rust:#c06a4d;
    --radius:14px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f7f4ee; --bg2:#f0ebe1; --card:#ffffff; --card-hi:#fbf8f2;
      --ink:#231f1a; --sub:#7a7060; --line:#e4dccb;
      --gold:#a9793a; --gold-soft:rgba(169,121,58,.12); --gold-line:rgba(169,121,58,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#f7f4ee; --bg2:#f0ebe1; --card:#ffffff; --card-hi:#fbf8f2;
    --ink:#231f1a; --sub:#7a7060; --line:#e4dccb;
    --gold:#a9793a; --gold-soft:rgba(169,121,58,.12); --gold-line:rgba(169,121,58,.4);
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height:100%;
  }
  .serif{font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif}

  /* ---------- Hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    padding:calc(28px + env(safe-area-inset-top,0px)) 20px 26px;
    background:
      radial-gradient(60% 140% at 85% -20%, var(--gold-soft), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    border-bottom:1px solid var(--line);
  }
  .hero-glow{
    position:absolute; top:-40px; right:-40px; width:220px; height:220px;
    background:radial-gradient(circle, rgba(201,161,90,.35), transparent 70%);
    filter:blur(10px); pointer-events:none;
    animation:glowPulse 5s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{opacity:.55; transform:scale(1)}
    50%{opacity:.9; transform:scale(1.12)}
  }
  .eyebrow{
    display:flex; align-items:center; gap:8px;
    font-size:.72rem; color:var(--gold); letter-spacing:.04em; margin-bottom:8px;
    opacity:0; animation:riseIn .6s ease-out .05s forwards;
  }
  .eyebrow .dot{width:5px; height:5px; border-radius:50%; background:var(--gold)}
  h1{
    font-family:'Cormorant Garamond', Georgia, serif; font-weight:600;
    font-size:clamp(1.6rem, 4vw, 2.1rem); margin:0 0 4px; line-height:1.15;
    opacity:0; animation:riseIn .6s ease-out .15s forwards;
  }
  .hero-sub{
    color:var(--sub); font-size:.88rem; margin:0 0 20px;
    opacity:0; animation:riseIn .6s ease-out .25s forwards;
  }
  @keyframes riseIn{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

  .progress-wrap{
    opacity:0; animation:riseIn .6s ease-out .35s forwards;
  }
  .progress-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
  .progress-num{font-family:'Cormorant Garamond', serif; font-size:1.5rem; color:var(--gold); font-weight:600}
  .progress-label{font-size:.78rem; color:var(--sub)}
  .progress-track{
    height:6px; border-radius:6px; background:var(--line); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:6px;
    background:linear-gradient(90deg, #9c7a3f, var(--gold));
    width:0%; transition:width .5s cubic-bezier(.22,.9,.3,1);
    box-shadow:0 0 10px var(--gold-soft);
  }

  /* ---------- Controls ---------- */
  .controls{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:6;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:12px 20px; display:flex; gap:8px; flex-wrap:wrap;
  }
  input[type=search], select{
    padding:10px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:.86rem; flex:1; min-width:130px;
    font-family:inherit;
  }
  input[type=search]:focus, select:focus{ outline:none; border-color:var(--gold-line) }
  .btn{
    padding:10px 16px; border-radius:10px; border:1px solid var(--gold-line); cursor:pointer;
    font-size:.84rem; font-weight:600; background:var(--gold); color:#221b0f;
    font-family:inherit; transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(.97) }
  .btn.ghost{ background:transparent; color:var(--gold) }

  /* ---------- List ---------- */
  main{padding:14px 20px 40px; max-width:920px; margin:0 auto}
  .grid{display:flex; flex-direction:column; gap:9px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; transition:border-color .25s ease, box-shadow .25s ease;
  }
  .card.priced{ border-color:var(--gold-line) }
  .card.flash{ animation:flashGold .9s ease }
  @keyframes flashGold{
    0%{ box-shadow:0 0 0 0 var(--gold-soft) }
    30%{ box-shadow:0 0 0 6px var(--gold-soft) }
    100%{ box-shadow:0 0 0 0 rgba(0,0,0,0) }
  }
  .card-top{
    display:flex; align-items:center; gap:12px; padding:11px 13px; cursor:pointer;
  }
  .thumb{
    width:44px; height:44px; border-radius:9px; background:var(--bg2);
    display:flex; align-items:center; justify-content:center; font-size:1rem;
    flex-shrink:0; border:1px solid var(--line); overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover }
  .info{ flex:1; min-width:0 }
  .sku{ font-weight:600; font-size:.83rem; color:var(--ink) }
  .name{ color:var(--sub); font-size:.76rem; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .tags{ display:flex; gap:5px; margin-top:5px; flex-wrap:wrap }
  .tag{ font-size:.66rem; padding:2px 8px; border-radius:20px; background:var(--bg2); color:var(--sub); border:1px solid var(--line) }
  .tag.cat{ color:var(--gold); border-color:var(--gold-line) }
  .cost{ font-size:.73rem; color:var(--sub); text-align:left; white-space:nowrap }
  .price-wrap{ display:flex; align-items:center; gap:7px; flex-shrink:0 }
  .price-wrap input{
    width:92px; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg2); color:var(--ink); font-size:.86rem; text-align:center; font-family:inherit;
  }
  .price-wrap input:focus{ outline:none; border-color:var(--gold-line) }
  .margin{ font-size:.68rem; min-width:34px; text-align:center; color:var(--sub) }
  .margin.pos{ color:var(--green) }
  .margin.neg{ color:var(--rust) }
  .chevron{
    width:20px; height:20px; flex-shrink:0; color:var(--sub);
    transition:transform .25s ease;
  }
  .card.open .chevron{ transform:rotate(180deg) }

  .card-detail{
    max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.22,.9,.3,1);
    border-top:1px solid transparent;
  }
  .card.open .card-detail{ border-top:1px solid var(--line) }
  .detail-inner{
    padding:13px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  .field{ display:flex; flex-direction:column; gap:5px }
  .field label{ font-size:.7rem; color:var(--sub) }
  .field select{ min-width:170px }
  .img-upload{
    display:flex; align-items:center; gap:9px;
  }
  .img-preview{
    width:56px; height:56px; border-radius:9px; overflow:hidden; border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; background:var(--bg2); font-size:1.1rem; color:var(--sub);
    flex-shrink:0;
  }
  .img-preview img{ width:100%; height:100%; object-fit:cover }
  .upload-btn{
    padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg2);
    color:var(--ink); font-size:.76rem; cursor:pointer; font-family:inherit;
  }
  .upload-btn:hover{ border-color:var(--gold-line) }
  .clear-img{ font-size:.7rem; color:var(--rust); cursor:pointer; background:none; border:none; text-decoration:underline; font-family:inherit; padding:0 }

  footer{
    position:sticky; bottom:0; padding:11px 20px calc(11px + env(safe-area-inset-bottom,0px));
    background:var(--bg); border-top:1px solid var(--line);
    text-align:center; color:var(--sub); font-size:.72rem;
  }
  .empty{ text-align:center; padding:50px 20px; color:var(--sub) }

  .toast{
    position:fixed; bottom:calc(70px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--card-hi); border:1px solid var(--gold-line); color:var(--ink);
    padding:10px 18px; border-radius:30px; font-size:.8rem; opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease; z-index:20; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0) }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-glow"></div>
  <div class="eyebrow"><span class="dot"></span>فتوح × أوشينج</div>
  <h1 class="serif">لوحة تسعير المنتجات</h1>
  <p class="hero-sub">دوّر، سعّر، صنّف، وضيف صورة — كل حاجة من مكان واحد</p>
  <div class="progress-wrap">
    <div class="progress-row">
      <span class="progress-num serif" id="progressNum">0%</span>
      <span class="progress-label"><b id="statDone">0</b> من <b id="statTotal">0</b> اتسعّروا</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="controls">
  <input type="search" id="q" placeholder="دور بالكود أو الاسم...">
  <select id="supplierFilter">
    <option value="">كل الموردين</option>
    <option value="فتوح">فتوح</option>
    <option value="أوشينج">أوشينج</option>
  </select>
  <select id="statusFilter">
    <option value="">كل الحالات</option>
    <option value="pending">لسه من غير سعر</option>
    <option value="done">اتسعّر</option>
  </select>
  <button class="btn" id="exportBtn">تصدير Excel</button>
  <button class="btn ghost" id="resetBtn">مسح الكل</button>
</div>

<main>
  <div class="grid" id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none">مفيش نتائج مطابقة</div>
</main>

<footer>البيانات بتتحفظ تلقائيًا في المتصفح ده. اضغط "تصدير Excel" لتنزيل ملف جاهز للرفع على السيستم.</footer>
<div class="toast" id="toast"></div>

<script>
(function(){
  const CATEGORIES = ["بدون تصنيف","اباجورات","اباليك","اطباق ليد 40 سم","اطباق ليد 50 سم","دلايات","دلايات معدن","دلايات مفرد ليد","فوانيس","لمبادير","نجف ديكوري","نجف شجرة","نجف كريستال","نجف كريستال الومنيوم","نجف كريستال ستانلس","نجف لوكس","نجف ليد"];

  const PRICE_KEY = 'sale_prices_v1';
  const CAT_KEY = 'sale_cats_v1';
  const IMG_KEY = 'sale_imgs_v1';

  function loadJSON(key){ try{ return JSON.parse(localStorage.getItem(key) || '{}'); }catch(e){ return {}; } }
  function saveJSON(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){} }

  let prices = loadJSON(PRICE_KEY);
  let cats = loadJSON(CAT_KEY);
  let imgs = loadJSON(IMG_KEY);

  const products = window.__PRODUCTS__ || [];
  const list = document.getElementById('list');
  const q = document.getElementById('q');
  const supplierFilter = document.getElementById('supplierFilter');
  const statusFilter = document.getElementById('statusFilter');
  const emptyMsg = document.getElementById('emptyMsg');
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1600);
  }

  function marginInfo(cost, sale){
    if(!sale || sale<=0) return {text:'—', cls:''};
    const m = ((sale-cost)/sale*100);
    return {text: m.toFixed(0)+'%', cls: m>=0?'pos':'neg'};
  }

  function catOptions(current){
    return CATEGORIES.map(c => `<option value="${c}" ${c===current?'selected':''}>${c}</option>`).join('');
  }

  function updateStats(){
    const doneCount = Object.keys(prices).filter(k => prices[k] !== '').length;
    const total = products.length;
    const pct = total ? Math.round(doneCount/total*100) : 0;
    document.getElementById('statDone').textContent = doneCount;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('progressNum').textContent = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function render(){
    const term = q.value.trim().toLowerCase();
    const sup = supplierFilter.value;
    const st = statusFilter.value;
    list.innerHTML = '';
    let shown = 0;

    products.forEach(function(p){
      const hasPrice = prices[p.sku] !== undefined && prices[p.sku] !== '';
      if(term && !(p.sku.toLowerCase().includes(term) || p.name.toLowerCase().includes(term))) return;
      if(sup && p.supplier !== sup) return;
      if(st === 'pending' && hasPrice) return;
      if(st === 'done' && !hasPrice) return;
      shown++;

      const saleVal = prices[p.sku] !== undefined ? prices[p.sku] : '';
      const catVal = cats[p.sku] || p.category || 'بدون تصنيف';
      const imgVal = imgs[p.sku];
      const mi = marginInfo(p.cost_price, parseFloat(saleVal));

      const card = document.createElement('div');
      card.className = 'card' + (hasPrice ? ' priced' : '');
      card.dataset.sku = p.sku;

      card.innerHTML = `
        <div class="card-top">
          <div class="thumb">${imgVal ? `<img src="${imgVal}">` : (p.has_image ? '🖼️' : '💡')}</div>
          <div class="info">
            <div class="sku">${p.sku}</div>
            <div class="name">${p.name}</div>
            <div class="tags"><span class="tag">${p.supplier}</span><span class="tag cat">${catVal}</span></div>
          </div>
          <div class="cost">تكلفة<br>${p.cost_price} ج</div>
          <div class="price-wrap">
            <input type="number" min="0" step="0.01" placeholder="سعر البيع" class="priceInput" value="${saleVal}">
            <span class="margin ${mi.cls}">${mi.text}</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="card-detail">
          <div class="detail-inner">
            <div class="field">
              <label>التصنيف</label>
              <select class="catSelect">${catOptions(catVal)}</select>
            </div>
            <div class="field">
              <label>صورة (اختياري، للمرجعية هنا بس)</label>
              <div class="img-upload">
                <div class="img-preview">${imgVal ? `<img src="${imgVal}">` : '📷'}</div>
                <input type="file" accept="image/*" class="fileInput" style="display:none">
                <button type="button" class="upload-btn">${imgVal ? 'تغيير الصورة' : 'إضافة صورة'}</button>
                ${imgVal ? '<button type="button" class="clear-img">مسح</button>' : ''}
              </div>
            </div>
          </div>
        </div>
      `;
      list.appendChild(card);
    });

    emptyMsg.style.display = shown === 0 ? 'block' : 'none';
    updateStats();
  }

  list.addEventListener('click', function(e){
    const card = e.target.closest('.card');
    if(!card) return;
    const sku = card.dataset.sku;

    if(e.target.closest('.card-top') && !e.target.closest('.price-wrap')){
      card.classList.toggle('open');
      const detail = card.querySelector('.card-detail');
      detail.style.maxHeight = card.classList.contains('open') ? detail.scrollHeight + 'px' : '0px';
      return;
    }

    if(e.target.classList.contains('upload-btn')){
      card.querySelector('.fileInput').click();
      return;
    }

    if(e.target.classList.contains('clear-img')){
      delete imgs[sku];
      saveJSON(IMG_KEY, imgs);
      render();
      toast('اتمسحت الصورة');
      return;
    }
  });

  list.addEventListener('change', function(e){
    const card = e.target.closest('.card');
    if(!card) return;
    const sku = card.dataset.sku;

    if(e.target.classList.contains('catSelect')){
      cats[sku] = e.target.value;
      saveJSON(CAT_KEY, cats);
      card.querySelector('.tag.cat').textContent = e.target.value;
      toast('اتحفظ التصنيف');
      return;
    }

    if(e.target.classList.contains('fileInput')){
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > 4*1024*1024){ toast('الصورة كبيرة أوي، اختار صورة أصغر'); return; }
      const reader = new FileReader();
      reader.onload = function(ev){
        imgs[sku] = ev.target.result;
        saveJSON(IMG_KEY, imgs);
        render();
        // re-open the card after re-render
        const newCard = list.querySelector(`.card[data-sku="${CSS.escape(sku)}"]`);
        if(newCard){
          newCard.classList.add('open');
          const detail = newCard.querySelector('.card-detail');
          detail.style.maxHeight = detail.scrollHeight + 'px';
          newCard.classList.add('flash');
          setTimeout(()=> newCard.classList.remove('flash'), 900);
        }
        toast('اتضافت الصورة');
      };
      reader.readAsDataURL(file);
      return;
    }
  });

  list.addEventListener('input', function(e){
    if(!e.target.classList.contains('priceInput')) return;
    const card = e.target.closest('.card');
    const sku = card.dataset.sku;
    const val = e.target.value;
    if(val === ''){ delete prices[sku]; } else { prices[sku] = val; }
    saveJSON(PRICE_KEY, prices);

    const p = products.find(x=>x.sku===sku);
    const mi = marginInfo(p.cost_price, parseFloat(val));
    const marginEl = card.querySelector('.margin');
    marginEl.textContent = mi.text;
    marginEl.className = 'margin ' + mi.cls;
    card.classList.toggle('priced', val !== '');
    updateStats();
  });

  list.addEventListener('blur', function(e){
    if(!e.target.classList.contains('priceInput')) return;
    const card = e.target.closest('.card');
    if(e.target.value !== '' && !card.dataset.flashed){
      card.classList.add('flash');
      setTimeout(()=> card.classList.remove('flash'), 900);
    }
  }, true);

  q.addEventListener('input', render);
  supplierFilter.addEventListener('change', render);
  statusFilter.addEventListener('change', render);

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('هيتم مسح كل الأسعار والتصنيفات والصور اللي دخلتها هنا. متأكد؟')){
      prices = {}; cats = {}; imgs = {};
      saveJSON(PRICE_KEY, prices); saveJSON(CAT_KEY, cats); saveJSON(IMG_KEY, imgs);
      render();
      toast('اتمسح كل حاجة');
    }
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    const rows = [['name','sku','barcode','category','unit','unit_measurement','color','cost_price','sale_price','min_stock_threshold','description']];
    products.forEach(function(p){
      const sale = prices[p.sku] || '';
      const cat = cats[p.sku] || p.category || 'بدون تصنيف';
      rows.push([p.name, p.sku, '', cat, 'piece', '', '', p.cost_price, sale, 4, '']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تحديث المنتجات');
    XLSX.writeFile(wb, 'تحديث_اسعار_وتصنيفات.xlsx');
    toast('اتنزل ملف الإكسيل');
  });

  render();
})();
</script>
</body>
</html>
